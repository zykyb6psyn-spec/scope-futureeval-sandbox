name: SCOPE Sandbox Integrity Check

on:
  pull_request:
    paths:
      - "scope_smoke_test.py"
      - "scope_audit.py"
      - "scope_integrity_check.py"
      - "scope_sandbox_config.json"
      - "scope_preregistration.json"
      - "poetry.lock"
      - "pyproject.toml"
      - ".github/workflows/scope_smoke_test.yaml"
      - ".github/workflows/scope_integrity_check.yaml"
  push:
    branches: [main]
    paths:
      - "scope_smoke_test.py"
      - "scope_audit.py"
      - "scope_integrity_check.py"
      - "scope_sandbox_config.json"
      - "scope_preregistration.json"
      - "poetry.lock"
      - "pyproject.toml"
      - ".github/workflows/scope_smoke_test.yaml"
      - ".github/workflows/scope_integrity_check.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Run syntax checks
        run: python -m py_compile scope_smoke_test.py scope_audit.py scope_integrity_check.py

      - name: Run fail-closed integrity checks
        run: python scope_integrity_check.py
