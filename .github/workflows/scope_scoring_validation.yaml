name: SCOPE Scoring Validation

on:
  push:
    branches:
      - scope-benchmark-design-v0.1
    paths:
      - 'benchmark/scope_scoring.py'
      - 'benchmark/scope_statistics.py'
      - 'benchmark/scope_resolution_adapter.py'
      - 'benchmark/scope_scoring_validation.py'
      - 'benchmark/SCOPE_SCORING_SPEC_v0.1.md'
      - '.github/workflows/scope_scoring_validation.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  TZ: UTC

jobs:
  validate_scoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          check-latest: false

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263
        with:
          version: '2.4.2'
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install locked dependencies
        run: poetry sync --no-interaction --no-root

      - name: Syntax preflight
        run: |
          poetry run python -m py_compile \
            benchmark/scope_scoring.py \
            benchmark/scope_statistics.py \
            benchmark/scope_resolution_adapter.py \
            benchmark/scope_scoring_validation.py

      - name: Run offline scoring validation
        env:
          PYTHONPATH: benchmark
        run: poetry run python benchmark/scope_scoring_validation.py

      - name: Preserve validation record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scope-scoring-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark/scoring_validation_output/
          if-no-files-found: warn
          retention-days: 90
